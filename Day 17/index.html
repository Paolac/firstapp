<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Animation</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.contact-form-container {
			max-width: 500px;
			margin: 30px auto;
			padding: 20px;
			background-color: rgba(255, 255, 255, 0.9);
			border-radius: 10px;
			box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
		}
		
		.contact-form-container h2 {
			color: #462c69;
			text-align: center;
			margin-bottom: 20px;
		}
		
		.form-group {
			margin-bottom: 15px;
		}
		
		.form-group label {
			display: block;
			margin-bottom: 5px;
			font-weight: bold;
			color: #462c69;
		}
		
		.form-group input,
		.form-group textarea,
		.form-group select {
			width: 100%;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 5px;
			font-size: 16px;
		}
		
		.form-group textarea {
			height: 100px;
			resize: vertical;
		}
		
		.form-group input:focus,
		.form-group textarea:focus,
		.form-group select:focus {
			outline: none;
			border-color: #37850e;
			box-shadow: 0 0 5px rgba(55, 133, 14, 0.5);
		}
		
		.form-group input:invalid,
		.form-group textarea:invalid,
		.form-group select:invalid {
			border-color: #ff3860;
		}
		
		.error {
			color: #ff3860;
			font-size: 14px;
			margin-top: 5px;
			display: none;
		}
		
		button[type="submit"] {
			background-color: #37850e;
			color: white;
			border: none;
			padding: 12px 20px;
			border-radius: 5px;
			cursor: pointer;
			font-size: 16px;
			display: block;
			margin: 0 auto;
			transition: background-color 0.3s;
		}
		
		button[type="submit"]:hover {
			background-color: #2c6b0b;
		}
		
		.success-message {
			color: #37850e;
			text-align: center;
			margin-top: 15px;
			display: none;
		}
	</style>
</head>
<body>
	<div class="buzz">
	<div class="head"></div>
	<div class="hearleft"></div>
	<div class="hearright"></div>
	<div class="face">
		<div class="eyeleft"></div>
		<div class="eyeright"></div>
		<div class="eyebrowleft"></div>
		<div class="eyebrowright"></div>
		<div class="mouth">
			<div class="thoot1"></div>
			<div class="thoot2"></div>
		</div>
		<div class="chin"></div>
	</div>

	<div class="trunk">
		<div class="neck"></div>
		<div class="greenleft"></div>
		<div class="greenright"></div>
		<div class="green"></div>
		<div class="btn1"></div>
		<div class="btn2"></div>
		<div class="btn3"></div>
		<div class="btn4"></div>
		<div class="purple1"></div>
		<div class="purple2"></div>
		<div class="armleft">
			<img src="armleft.svg" alt="" width="107px">
		</div>
		<div class="armright">
			<img src="armright.svg" alt="" width="117px">
		</div>
	</div>

	<div class="hips"></div>

<div class ="legs">
		<img src="pies.svg" alt="" width="240px">
	</div>


	</div>
	
	<div class="shadow"></div>
	
	<div class="contact-form-container">
		<h2>Contact Space Ranger Buzz</h2>
		<form id="contactForm" novalidate>
			<div class="form-group">
				<label for="name">Name *</label>
				<input type="text" id="name" name="name" required minlength="2" maxlength="50">
				<div class="error" id="nameError">Please enter a valid name (at least 2 characters)</div>
			</div>
			
			<div class="form-group">
				<label for="email">Email *</label>
				<input type="email" id="email" name="email" required>
				<div class="error" id="emailError">Please enter a valid email address</div>
			</div>
			
			<div class="form-group">
				<label for="planet">Home Planet *</label>
				<select id="planet" name="planet" required>
					<option value="">Select your planet</option>
					<option value="earth">Earth</option>
					<option value="mars">Mars</option>
					<option value="jupiter">Jupiter</option>
					<option value="saturn">Saturn</option>
					<option value="other">Other</option>
				</select>
				<div class="error" id="planetError">Please select your home planet</div>
			</div>
			
			<div class="form-group">
				<label for="age">Age *</label>
				<input type="number" id="age" name="age" required min="1" max="120">
				<div class="error" id="ageError">Please enter a valid age (1-120)</div>
			</div>
			
			<div class="form-group">
				<label for="message">Message *</label>
				<textarea id="message" name="message" required minlength="10"></textarea>
				<div class="error" id="messageError">Please enter a message (at least 10 characters)</div>
			</div>
			
			<button type="submit">Send Message to Infinity and Beyond!</button>
			<div class="success-message" id="successMessage">Your message has been sent to Buzz Lightyear!</div>
		</form>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', function() {
			const form = document.getElementById('contactForm');
			const nameInput = document.getElementById('name');
			const emailInput = document.getElementById('email');
			const planetInput = document.getElementById('planet');
			const ageInput = document.getElementById('age');
			const messageInput = document.getElementById('message');
			
			const nameError = document.getElementById('nameError');
			const emailError = document.getElementById('emailError');
			const planetError = document.getElementById('planetError');
			const ageError = document.getElementById('ageError');
			const messageError = document.getElementById('messageError');
			const successMessage = document.getElementById('successMessage');
			
			// Show error message
			function showError(input, errorElement, message) {
				errorElement.textContent = message;
				errorElement.style.display = 'block';
				input.classList.add('invalid');
				return false;
			}
			
			// Hide error message
			function hideError(input, errorElement) {
				errorElement.style.display = 'none';
				input.classList.remove('invalid');
				return true;
			}
			
			// Validate name
			function validateName() {
				if (nameInput.validity.valueMissing) {
					return showError(nameInput, nameError, 'Name is required');
				} else if (nameInput.validity.tooShort) {
					return showError(nameInput, nameError, 'Name must be at least 2 characters');
				} else {
					return hideError(nameInput, nameError);
				}
			}
			
			// Validate email
			function validateEmail() {
				const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
				if (emailInput.validity.valueMissing) {
					return showError(emailInput, emailError, 'Email is required');
				} else if (!emailRegex.test(emailInput.value)) {
					return showError(emailInput, emailError, 'Please enter a valid email address');
				} else {
					return hideError(emailInput, emailError);
				}
			}
			
			// Validate planet
			function validatePlanet() {
				if (planetInput.validity.valueMissing) {
					return showError(planetInput, planetError, 'Please select your home planet');
				} else {
					return hideError(planetInput, planetError);
				}
			}
			
			// Validate age
			function validateAge() {
				if (ageInput.validity.valueMissing) {
					return showError(ageInput, ageError, 'Age is required');
				} else if (ageInput.validity.rangeUnderflow) {
					return showError(ageInput, ageError, 'Age must be at least 1');
				} else if (ageInput.validity.rangeOverflow) {
					return showError(ageInput, ageError, 'Age must be less than 120');
				} else {
					return hideError(ageInput, ageError);
				}
			}
			
			// Validate message
			function validateMessage() {
				if (messageInput.validity.valueMissing) {
					return showError(messageInput, messageError, 'Message is required');
				} else if (messageInput.validity.tooShort) {
					return showError(messageInput, messageError, 'Message must be at least 10 characters');
				} else {
					return hideError(messageInput, messageError);
				}
			}
			
			// Add input event listeners for real-time validation
			nameInput.addEventListener('input', validateName);
			emailInput.addEventListener('input', validateEmail);
			planetInput.addEventListener('change', validatePlanet);
			ageInput.addEventListener('input', validateAge);
			messageInput.addEventListener('input', validateMessage);
			
			// Form submission
			form.addEventListener('submit', function(event) {
				event.preventDefault();
				
				// Validate all fields
				const isNameValid = validateName();
				const isEmailValid = validateEmail();
				const isPlanetValid = validatePlanet();
				const isAgeValid = validateAge();
				const isMessageValid = validateMessage();
				
				// If all validations pass
				if (isNameValid && isEmailValid && isPlanetValid && isAgeValid && isMessageValid) {
					// Show success message
					successMessage.style.display = 'block';
					
					// Reset form after 3 seconds
					setTimeout(function() {
						form.reset();
						successMessage.style.display = 'none';
					}, 3000);
				}
			});
		});
	</script>
</body>
</html>
